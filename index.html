<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>map</title>
        <link rel="stylesheet" href="styles.css">
        <!-- Leaflet -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    </head>
    <body>
        <main>
            <h1>map</h1>
            <div id="map"></div>
            <div class="options">
                <input type="button" id="geo-enable" value="enable tracking" onclick="startTracking()">
                <input type="button" id="geo-disable" value="disable tracking" onclick="stopTracking()" disabled>
            </div>
            <p id="geo-text">tracking disabled</p>
            <div class="options">
                <input type="button" id="audio-enable" value="enable listening" onclick="startListening()">
                <input type="button" id="audio-disable" value="disable listening" onclick="stopListening()" disabled>
            </div>
            <p id="audio-text">listening disabled</p>
            <div class="options">
                <input type="button" id="reverb-enable" value="enable reverb" onclick="enableReverb()">
                <input type="button" id="reverb-disable" value="disable reverb" onclick="disableReverb()" disabled>
            </div>
            <p id="reverb-text">reverb disabled</p>
            <div class="options">
                <label for="input-select">input:</label>
                <select name="inputs" id="input-select" onchange="inputChanged()">
                    <option value="">Default</option>
                </select>
                <br>
                <label for="output-select">output:</label>
                <select name="outputs" id="output-select" onchange="outputChanged()">
                    <option value="">Default</option>
                </select>
                <br>
                <input type="button" id="update-devices" value="update devices" onclick="updateDevices()">
            </div>
            <!-- <p id="device-info">device info</p> -->
        </main>
        <footer>
            
        </footer>
    </body>
    <script>

        // initialize map, set coordinates and zoom level
        //var map = L.map('map').setView([51.505, -0.09], 13);
        var map = L.map('map', {
            center: [60.196772, 24.967265],
            zoom: 18
        });
        // add tile layer
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // TESTING geolocation tracking

        let watchID = null; // ID for geolocation position watcher
        let userMarker; // marker drawn to user location
        let userCircle; // circle drawn around user location representing accuracy

        // start tracking geolocation
        function startTracking() {
            if (watchID != null) {
                document.getElementById("geo-text").innerHTML = "tracking already enabled";
            } else {
                document.getElementById("geo-text").innerHTML = "tracking enabled";
                watchID = navigator.geolocation.watchPosition(success, error, {enableHighAccuracy: true});
                document.getElementById("geo-disable").disabled = false; // enable stop button
                document.getElementById("geo-enable").disabled = true; // disable start button
            }
        }
        // stop tracking geolocation
        function stopTracking() {
            navigator.geolocation.clearWatch(watchID)
            watchID = null;
            document.getElementById("geo-text").innerHTML = "tracking disabled";
            document.getElementById("geo-enable").disabled = false; // enable start button
            document.getElementById("geo-disable").disabled = true; // disable stop button
            // if marker exists, remove it
            if (userMarker) {
                map.removeLayer(userMarker);
                map.removeLayer(userCircle);
            }
        }
        
        // launched when position is fetched successfully
        function success(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            const timestamp = position.timestamp;
            const time = new Date(timestamp);
            // if marker already exists, remove it
            if (userMarker) {
                map.removeLayer(userMarker);
                map.removeLayer(userCircle);
            }
            // add new marker and circle
            userMarker = L.marker([lat, lng]).addTo(map);""
            userCircle = L.circle([lat, lng], {
                radius: accuracy,
                color: 'white',
                fillOpacity: 0.3
            }).addTo(map)
            // set map view to marker
            map.setView([lat, lng]);
            // print coordinates, accuracy and time
            document.getElementById("geo-text").innerHTML = "lat: " + String(lat) + "<br>lng: " + String(lng) + "<br>accuracy: " + String(+accuracy.toFixed(2)) + " m<br>" + time.toString().split(' (')[0];
        }
        // launched when position cannot be fetched
        function error(error) {
            if (error.code === 1) {
                //document.getElementById("geo-text").innerHTML = "please allow geolocation access";
                document.getElementById("geo-text").innerHTML = "please allow geolocation access";
            } else {
                document.getElementById("geo-text").innerHTML = "cannot get location";
            }
        }

        // TESTING Web Audio API

        let audioContext = new AudioContext(); // audio context variable
        let reverb = audioContext.createConvolver(); // reverb (convolver)
        let reverb_enabled = false; // reverb state flag
        let stream = null; // user media audio stream
        let source = null; // audio source variable
        let input_id = null; // selected input deviceId

        loadReverb(); // load impulse response file

        // update devices (inputs and outputs)
        async function updateDevices() {
            devices = await navigator.mediaDevices.enumerateDevices();
            devices.forEach((device) => console.log(`kind = ${device.kind} label = ${device.label} deviceId = ${device.deviceId} groupId = ${device.groupId}`));
            // add to input & output select
            input_select = document.getElementById("input-select");
            clearOptions(input_select);
            output_select = document.getElementById("output-select");
            clearOptions(output_select);
            devices.forEach((device) => {
                if (device.kind =="audioinput") {
                    addOption(input_select, device.deviceId, device.label);
                } else if (device.kind =="audiooutput") {
                    addOption(output_select, device.deviceId, device.label);
                }
            });
        }

        // log device info (capabilities) to console
        function logDeviceInfo() {
            tracks = stream.getTracks();
            tracks.map((t) => console.log(t.getCapabilities()));
        }

        function clearOptions(select) {
            for (option in select.options) {
                select.options.remove(0);
            }
        }

        function addOption(select, value, label) {
            option = document.createElement('option');
            option.value = value;
            option.innerHTML = label;
            select.appendChild(option);
        }

        async function inputChanged() {
            input_id = document.getElementById("input-select").value;
            console.log(`selected input_id: ${input_id}`);
            try {
                if (source != null) {
                    stopListening();
                }
                await startListening();
                logDeviceInfo();
            } catch (error) {
                document.getElementById("audio-text").innerHTML = error;
            }
        }

        function outputChanged() {
            output_id = document.getElementById("output-select").value;
            console.log(`selected output_id: ${output_id}`);
        }

        // start listening to user's microphone
        async function startListening() {
            try {
                // get user device audio (default input or inputId)
                if (input_id == null) {
                    stream = await navigator.mediaDevices.getUserMedia({audio: true});
                } else {
                    stream = await navigator.mediaDevices.getUserMedia({audio: {deviceId: {exact: input_id}}});
                }
                // set device audio as audio context's source
                source = audioContext.createMediaStreamSource(stream);
                // connect source to destination or reverb
                if (!reverb_enabled) {
                    source.connect(audioContext.destination);
                } else {
                    source.connect(reverb);
                }
                document.getElementById("audio-text").innerHTML = "listening enabled";
                document.getElementById("audio-disable").disabled = false; // enable stop button
                document.getElementById("audio-enable").disabled = true; // disable start button
            } catch (error) {
                document.getElementById("audio-text").innerHTML = error;
            }
        }

        // stop listening to user's microphone
        function stopListening() {
            if (reverb_enabled) {
                source.disconnect(reverb);
            } else {
                source.disconnect(audioContext.destination);
            }
            source = null;
            document.getElementById("audio-text").innerHTML = "listening disabled";
            document.getElementById("audio-enable").disabled = false; // enable start button
            document.getElementById("audio-disable").disabled = true; // disable stop button
        }

        // load impulse response file
        async function loadReverb() {
            let response = await fetch("./res/audio/ir-test.wav");
            let arraybuffer = await response.arrayBuffer();
            reverb.buffer = await audioContext.decodeAudioData(arraybuffer);
        }
        
        // connect reverb between source and destination
        function enableReverb() {
            document.getElementById("reverb-text").innerHTML = "enabling reverb...";
            if (source != null) {
                source.disconnect(audioContext.destination);
                source.connect(reverb);
            }
            reverb.connect(audioContext.destination);
            document.getElementById("reverb-text").innerHTML = "reverb enabled";
            document.getElementById("reverb-enable").disabled = true;
            document.getElementById("reverb-disable").disabled = false;
            reverb_enabled = true;
        }

        function disableReverb() {
            reverb.disconnect(audioContext.destination);
            if (source != null) {
                source.disconnect(reverb);
                source.connect(audioContext.destination);
            }
            document.getElementById("reverb-text").innerHTML = "reverb disabled";
            document.getElementById("reverb-enable").disabled = false;
            document.getElementById("reverb-disable").disabled = true;
            reverb_enabled = false;
        }
        
        // TESTING map objects

        // add marker
        //var marker = L.marker([60.196926, 24.966691]).addTo(map);
        // add circles
        var circle1 = L.circle([60.196802, 24.967040]).addTo(map);
        var circle2 = L.circle([60.196897, 24.967420], {
            color: 'yellow',
            fillColor: 'black',
            fillOpacity: 0.4,
            radius: 4
        }).addTo(map);
        // add polygon
        var polygon1 = L.polygon([
            [60.196732, 24.967318],
            [60.196810, 24.967619],
            [60.196650, 24.967686],
            [60.196668, 24.967325]
        ]).addTo(map);
        var polygon2 = L.polygon([
            [60.196556, 24.966981],
            [60.196650, 24.966871],
            [60.196558, 24.967233]
            ], {
            color: 'white',
            fillOpacity: 0.8
        }).addTo(map);
        // add popups
        //marker.bindPopup("marker").openPopup();
        //marker.bindPopup("marker");
        circle1.bindPopup("circle1");
        circle2.bindPopup("circle2");
        polygon1.bindPopup("polygon1");
        polygon2.bindPopup("polygon2");
        // var standalonePopup = L.popup()
        //     .setLatLng([60.197021, 24.967640])
        //     .setContent("standalone popup")
        //     .openOn(map);

        // print coordinates on click
        var popup = L.popup();
        function onMapClick(e) { // e = event object
            popup
                .setLatLng(e.latlng)
                .setContent(String(e.latlng))
                .openOn(map);
            //alert("click coordinates: " + e.latlng);
        }
        map.on('click', onMapClick);

    </script>
</html>
